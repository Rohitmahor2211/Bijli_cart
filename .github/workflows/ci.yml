name: BijliCart CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --bind_ip_all
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGO_TEST_URI: ${{ secrets.MONGO_TEST_URI }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Initialize MongoDB Replica Set
        run: |
          docker exec ${{ job.services.mongodb.id }} mongosh --eval '
            rs.initiate({
              _id: "rs0",
              members: [
                {
                  _id: 0,
                  host: "127.0.0.1:27017"
                }
              ]
            })
          '

      - name: Verify MongoDB Replica Set
        run: |
          docker exec ${{ job.services.mongodb.id }} mongosh --eval '
            rs.status()
          '

      - run: npm run check:backend
      - run: npm test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build