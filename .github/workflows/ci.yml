name: BijliCart CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      # CI uses the isolated MongoDB replica set started below, not Atlas.
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/bijlicart_test?replicaSet=test-rs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Start MongoDB replica set
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: 7.0
          mongodb-replica-set: test-rs

      - name: Install backend dependencies
        run: npm ci

      - name: Backend checks
        run: npm run check:backend

      - name: Run backend tests
        run: npm test

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend lint
        run: npm run lint

      - name: Frontend build
        run: npm run build